- insert:
    - id: mcp-molclaw-scp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: molclaw-scp
        transport: stdio
        command: bash
        args:
          - /root/slime_sxy/group-space/sunxiangyu/drug-pipe/runtime/molclaw_mcp.sh
        env:
          DRUG_PROJECT: /root/slime_sxy/group-space/sunxiangyu/drug-pipe
          SECRET_FILE: /root/.dsh/molclaw.env
          MOLCLAW_POLL_INTERVAL_SECONDS: '300'
        toolCallTimeoutMs: 14400000
        failOnStartupError: true
