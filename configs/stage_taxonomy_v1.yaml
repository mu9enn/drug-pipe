version: stage_taxonomy_v1
stages:
  - acquisition_lookup
  - entity_resolution
  - protein_prep
  - ligand_prep
  - generation_editing
  - simulation_prediction
  - filtering_selection
  - ranking_scoring
  - validation_crosscheck
  - reporting_visualization

hard_transition_blocks:
  - [reporting_visualization, acquisition_lookup]
  - [reporting_visualization, entity_resolution]
  - [reporting_visualization, protein_prep]
  - [reporting_visualization, ligand_prep]

soft_transition_priors:
  acquisition_lookup: [entity_resolution, protein_prep, ligand_prep]
  entity_resolution: [protein_prep, ligand_prep]
  protein_prep: [simulation_prediction, validation_crosscheck]
  ligand_prep: [simulation_prediction, filtering_selection]
  generation_editing: [filtering_selection, simulation_prediction]
  simulation_prediction: [ranking_scoring, validation_crosscheck, reporting_visualization]
  filtering_selection: [ranking_scoring, simulation_prediction]
  ranking_scoring: [validation_crosscheck, reporting_visualization]
  validation_crosscheck: [reporting_visualization, ranking_scoring]
  reporting_visualization: []

alternative_stage_window:
  max_hop: 1
