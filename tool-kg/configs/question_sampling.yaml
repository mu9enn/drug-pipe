version: question_sampling_profiles_v1

profiles:
  simple_default:
    mode: simple_toolchain_question
    prompt: prompts/toolchain_question_simple_v1.md
    json_repair_prompt: prompts/toolchain_question_json_repair_v1.md
    semantic_repair_prompt: prompts/toolchain_question_semantic_repair_v1.md
    min_hops: 2
    max_hops: 4
    target_successes: 20
    max_attempts: 100
    random_seed: 42
    science_kb_topk: 3
    grounding_selection: random_seeded
    max_repeat_target: 2
    max_repeat_compound: 2
    json_repair_rounds: 1
    semantic_repair_rounds: 1
    partial_edge_policy: allow_if_closure_satisfied
    tool_leak_policy: warn
